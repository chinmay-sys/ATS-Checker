<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered ATS Resume Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%),
                url('https://images.unsplash.com/photo-1557804506-669a67965ba0?w=1920&q=80') center/cover fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="password"],
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #475569;
            border-radius: 8px;
            background: rgba(51, 65, 85, 0.5);
            color: #e2e8f0;
        }

        input[type="file"] {
            border-style: dashed;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #475569;
            border-radius: 8px;
            min-height: 150px;
            font-family: Arial, sans-serif;
            resize: vertical;
            background: rgba(51, 65, 85, 0.5);
            color: #e2e8f0;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            margin-top: 30px;
            display: none;
        }

        .score-card {
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .score {
            font-size: 64px;
            font-weight: bold;
            margin: 10px 0;
        }

        .section {
            background: rgba(51, 65, 85, 0.5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section h3 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        .ai-content {
            color: #cbd5e1;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .change-item {
            background: rgba(71, 85, 105, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .change-title {
            font-weight: bold;
            color: #93c5fd;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .change-desc {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .keyword-badge {
            display: inline-block;
            padding: 5px 12px;
            margin: 3px;
            background: #ffc107;
            color: #000;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(71, 85, 105, 0.5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #93c5fd;
        }

        .stat-label {
            color: #cbd5e1;
            margin-top: 5px;
            font-size: 14px;
        }

        .api-note {
            background: rgba(59, 130, 246, 0.2);
            padding: 10px;
            border-radius: 8px;
            color: #93c5fd;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 AI-Powered ATS Checker</h1>
        <p class="subtitle">Get intelligent resume analysis powered by Gemini Pro</p>
        <form id="atsForm">
            <div class="form-group">
                <label>📄 Upload Resume (PDF)</label>
                <input type="file" id="resumeFile" accept=".pdf" required>
            </div>
            <div class="form-group">
                <label>📋 Job Description</label>
                <textarea id="jobDescription" placeholder="Paste the job description here..." required></textarea>
            </div>
            <button type="submit">Analyze with AI</button>
        </form>

        <div id="result">
            <div class="score-card">
                <div style="font-size: 18px; opacity: 0.9;">Your ATS Score</div>
                <div class="score" id="score"></div>
                <div id="scoreMessage"></div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="totalKeywords">0</div>
                    <div class="stat-label">Required Keywords</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="matchedKeywords">0</div>
                    <div class="stat-label">You Have</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="missingKeywords">0</div>
                    <div class="stat-label">Missing</div>
                </div>
            </div>

            <div class="section">
                <h3>🤖 AI-Powered Analysis</h3>
                <div id="aiSuggestions" class="ai-content"></div>
            </div>

            <div class="section">
                <h3>💡 Top Missing Keywords</h3>
                <div id="suggestedKeywords"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Hard-coded API key - Replace with your actual key
        const GEMINI_API_KEY = 'AIzaSyAd3tYiKjvG3oZ-ErRGssl8RDn1pgXu0fo';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function getAvailableModel(apiKey) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const data = await response.json();
                console.log('Available models:', data);

                // Find first model that supports generateContent
                const model = data.models?.find(m =>
                    m.supportedGenerationMethods?.includes('generateContent') &&
                    m.name.includes('gemini')
                );

                return model ? model.name : 'models/gemini-pro';
            } catch (error) {
                console.error('Error fetching models:', error);
                return 'models/gemini-pro';
            }
        }

        async function callGeminiAI(resumeText, jobDescription, score, missingKeywords, apiKey) {
            const prompt = `You are an ATS (Applicant Tracking System) expert. Analyze this resume against the job description.

RESUME:
${resumeText.substring(0, 3000)}

JOB DESCRIPTION:
${jobDescription}

CURRENT ATS SCORE: ${score.toFixed(1)}%
TOP MISSING KEYWORDS: ${missingKeywords.slice(0, 15).map(k => k.keyword).join(', ')}

Provide a detailed analysis with:
1. Overall Assessment (2-3 sentences)
2. Top 5 Specific Changes (be very specific with examples)
3. How to incorporate missing keywords naturally
4. Which resume sections need improvement

Be concise, actionable, and professional.`;

            try {
                // Get available model
                const modelName = await getAvailableModel(apiKey);
                console.log('Using model:', modelName);

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                console.log('API Response:', data); // Debug log

                if (data.candidates && data.candidates[0]) {
                    return data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    return `❌ API Error: ${data.error.message}. Check console for details.`;
                } else {
                    return "❌ Error: Invalid API key or API limit reached. Make sure you enabled the Generative Language API in Google Cloud Console.";
                }
            } catch (error) {
                return `❌ Error calling AI: ${error.message}`;
            }
        }

        function extractKeywords(text) {
            const words = text.toLowerCase().match(/\b[a-z]{3,}\b/g) || [];
            const stopWords = new Set(['the', 'and', 'for', 'with', 'this', 'that', 'from', 'have', 'will', 'are', 'was', 'were', 'been', 'has', 'had', 'can', 'could', 'would', 'should', 'may', 'might', 'must', 'our', 'your', 'their', 'into', 'through', 'during', 'before', 'after', 'above', 'below', 'between', 'under', 'again', 'further', 'then', 'once']);
            return words.filter(w => !stopWords.has(w));
        }

        function analyzeResume(resumeText, jobDescription) {
            const resumeKeywords = new Set(extractKeywords(resumeText));
            const jdKeywords = extractKeywords(jobDescription);
            const jdKeywordSet = new Set(jdKeywords);

            const keywordCount = {};
            jdKeywords.forEach(k => {
                keywordCount[k] = (keywordCount[k] || 0) + 1;
            });

            const missing = Object.entries(keywordCount)
                .filter(([k, v]) => !resumeKeywords.has(k))
                .sort((a, b) => b[1] - a[1])
                .map(([k, v]) => ({ keyword: k, count: v }));

            const matched = [...resumeKeywords].filter(k => jdKeywordSet.has(k));
            const score = jdKeywordSet.size > 0 ? (matched.length / jdKeywordSet.size) * 100 : 0;

            return {
                score: Math.min(score, 100),
                totalKeywords: jdKeywordSet.size,
                matchedKeywords: matched.length,
                missingKeywords: missing
            };
        }

        async function extractTextFromPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            let text = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(item => item.str).join(' ') + '\n';
            }

            return text;
        }

        document.getElementById('atsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('resumeFile');
            const jobDescription = document.getElementById('jobDescription').value;
            const apiKey = GEMINI_API_KEY; // Use hard-coded API key
            const button = e.target.querySelector('button');

            button.textContent = 'Analyzing...';
            button.disabled = true;

            try {
                const resumeText = await extractTextFromPDF(fileInput.files[0]);
                const analysis = analyzeResume(resumeText, jobDescription);

                // Display score
                document.getElementById('score').textContent = analysis.score.toFixed(1) + '%';

                let scoreMsg = '';
                if (analysis.score >= 70) scoreMsg = '✅ Excellent Match!';
                else if (analysis.score >= 50) scoreMsg = '⚡ Good - Needs Improvement';
                else scoreMsg = '⚠️ Low Match - Action Required';
                document.getElementById('scoreMessage').textContent = scoreMsg;

                // Display stats
                document.getElementById('totalKeywords').textContent = analysis.totalKeywords;
                document.getElementById('matchedKeywords').textContent = analysis.matchedKeywords;
                document.getElementById('missingKeywords').textContent = analysis.missingKeywords.length;

                // Get AI suggestions
                if (apiKey) {
                    button.textContent = 'Getting AI Analysis...';
                    const aiAnalysis = await callGeminiAI(resumeText, jobDescription, analysis.score, analysis.missingKeywords, apiKey);
                    document.getElementById('aiSuggestions').textContent = aiAnalysis;
                } else {
                    document.getElementById('aiSuggestions').innerHTML = `
                        <div style="color: #fbbf24;">⚠️ No API key provided</div>
                        <div style="margin-top: 10px;">Add your Gemini API key above to get AI-powered suggestions on how to improve your resume.</div>
                        <div style="margin-top: 10px;">Without AI, here's what you need to do:</div>
                        <div style="margin-top: 10px;">• Add the missing keywords listed below to your resume<br>• Update your work experience with relevant technologies<br>• Add a professional summary with key skills<br>• Include relevant projects and certifications</div>
                    `;
                }

                // Display suggested keywords
                const suggestedKeywords = document.getElementById('suggestedKeywords');
                const topMissing = analysis.missingKeywords.slice(0, 25);
                suggestedKeywords.innerHTML = `
                    <div style="color: #cbd5e1; margin-bottom: 15px;">Add these keywords to your resume (frequency in job description shown):</div>
                    <div>${topMissing.map(m => `<span class="keyword-badge">${m.keyword}${m.count > 1 ? ' (' + m.count + 'x)' : ''}</span>`).join('')}</div>
                `;

                document.getElementById('result').style.display = 'block';
                document.getElementById('result').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert('Error: ' + error.message);
            }

            button.textContent = 'Analyze with AI';
            button.disabled = false;
        });
    </script>
</body>

</html>
